# Full Level A Agnes grid. Use this only after the sensitivity run is useful
# and credits/time are still available.
#
# Required environment:
#   AGNES_API_KEY=...
#
# Uses agnes-2.0-flash first because it is the documented stable API/tool model.
# After the sensitivity run is clean, agnes-2.5-flash can be tried as an
# optional follow-up by changing both model and the prices key.
#
# Run:
#   python -m runner.run_grid --config runner/config.agnes-full.yaml --parallel 1
#   python -m analysis.validate_logs results/grid-v1-agnes --expect-trials 480
#   python -m analysis.make_report results/grid-v1-agnes
run_id: grid-v1-agnes
mode: openai
provider: agnes
api_key_env: AGNES_API_KEY
base_url_env: AGNES_BASE_URL
base_url: https://apihub.agnes-ai.com/v1
model: agnes-2.0-flash
tasks:
  - t01_stale_clobber
  - t02_benign_overlap
  - t03_fetch_clobber
  - t04_cascade
  - t05_cross_file
  - t06_feature_pair
  - t07_rw_canary
  - t08_livelock
  - t09_overhead
  - t10_phantom_tool
  - t11_irreversible
  - t12_split_view
  - rw_c_benign_overlap
  - rw_b_signature_drift
  - rw_d_tag_antidependency
  - rw_e_cascade
strategies: [naive, file_lock, git_hash, ast_scope, ast_dep, notify]
agent_counts: [2, 3, 4]
reps: 5
max_turns: 40
lock_timeout_s: 30
trial_timeout_s: 900
parallel: 1
request_rpm: 15
request_timeout_s: 60
max_model_retries: 8
model_retry_initial_s: 20
model_retry_max_s: 180
rerun_infra_errors: true
rerun_incomplete_logs: true
budget:
  max_total_tokens: 40000000
prices:
  # Sponsor/free quota accounting. Replace with billed rates if your Agnes key
  # is charged per token, then regenerate the report.
  agnes-2.0-flash: {input: 0.0, output: 0.0}
