# Tiny Agnes connectivity check. Run this before the 144-trial sensitivity grid
# when provider throughput is uncertain.
#
# Run:
#   python -m runner.run_grid --config runner/config.agnes-tiny.yaml --parallel 1
#   python -m analysis.validate_logs results/grid-v1-agnes-tiny --expect-trials 1
run_id: grid-v1-agnes-tiny
mode: openai
provider: agnes
api_key_env: AGNES_API_KEY
base_url_env: AGNES_BASE_URL
base_url: https://apihub.agnes-ai.com/v1
model: agnes-2.0-flash
tasks:
  - t01_stale_clobber
strategies: [naive]
agent_counts: [2]
reps: 1
max_turns: 12
lock_timeout_s: 30
trial_timeout_s: 900
parallel: 1
request_rpm: 15
request_timeout_s: 60
max_model_retries: 4
model_retry_initial_s: 20
model_retry_max_s: 120
rerun_infra_errors: true
rerun_incomplete_logs: true
budget:
  max_total_tokens: 1000000
prices:
  agnes-2.0-flash: {input: 0.0, output: 0.0}
