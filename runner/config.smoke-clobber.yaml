# Offline anomaly demonstration: stale whole-file writes.
# Shows naive silently losing an update while git_hash merges or surfaces it.
run_id: smoke-clobber
mode: scripted
script_variant: clobber
tasks:
  - t01_stale_clobber
strategies: [naive, git_hash]
agent_counts: [2]
reps: 1
max_turns: 12
lock_timeout_s: 10
trial_timeout_s: 120
