# Targeted live-model run for peer coordination strategies.
#
# This is intentionally smaller than the full grid. It focuses on tasks where
# write races, antidependencies, or cascades are likely to expose the difference
# between voluntary peer contracts and forced brokered negotiation.
#
# Recommended flow:
#   1. Run this once as-is. It spends only on the new peer strategies.
#   2. Compare against existing grid-v1 baselines in analysis/writeup.
#   3. If the signal is interesting, raise reps to 3 or 5.
run_id: grid-v1-peer-targeted-v5
mode: openai
provider: openai
model: gpt-5-mini
tasks:
  - t02_benign_overlap
  - t03_fetch_clobber
  - t04_cascade
  - rw_d_tag_antidependency
  - rw_e_cascade
strategies:
  - peer_contract
  - peer_broker
agent_counts: [2, 3, 4]
reps: 1
max_turns: 40
lock_timeout_s: 30
trial_timeout_s: 900
parallel: 2
budget:
  max_usd: 3
  max_total_tokens: 5000000
prices:
  gpt-5-mini: {input: 0.25, output: 2.00}
