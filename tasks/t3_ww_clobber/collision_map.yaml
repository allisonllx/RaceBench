failure_mode: write_write_clobber
collision_points:
  - file: api.py
    symbol: fetch
    agents: [agent-timeout, agent-retries]
    kind: same_symbol_write
expected_anomaly: >
  Both agents rewrite the body and signature of fetch(). Under naive
  coordination the second write clobbers the first (last write wins) and one
  feature vanishes. Symbol-level locking serializes the writes but the second
  agent still holds a stale view; correctness requires it to re-read and
  integrate. This is the true-positive counterpart to t2: here every stall is
  justified.
