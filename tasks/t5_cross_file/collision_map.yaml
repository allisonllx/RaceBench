failure_mode: cross_file_dependency
collision_points:
  - file: models.py
    symbol: make_user -> create_user
    agents: [agent-models]
    kind: interface_change
  - file: services.py
    symbol: register
    agents: [agent-services]
    kind: stale_premise_consumer
expected_anomaly: >
  No same-file write ever happens, so naive, file_lock, git_hash, and
  ast_scope all report zero conflicts — while agent-services may ship code
  calling a function that no longer exists. The failure is only visible to a
  mechanism that tracks cross-file read dependencies (none of the four under
  test). Recovery depends on the agent re-running tests after the interface
  change lands.
