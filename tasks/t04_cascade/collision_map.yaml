failure_mode: causal_cascade
collision_points:
  - file: datasource/parser.py
    symbol: parse_records -> parse_dataset
    agents: [agent-datasource]
    kind: interface_rename
  - file: pipeline/text.py
    symbol: summarize_text
    agents: [agent-pipeline]
    kind: stale_premise_consumer
expected_anomaly: >
  agent-pipeline reads datasource (possibly before the rename lands) and
  writes a call to the OLD function name; the final pipeline raises
  AttributeError end-to-end. Multi-package layout forces agents to navigate
  the import graph. File-scoped strategies cannot see this cross-package
  invalidation.
