name: t4_cascade
failure_mode: causal_cascade
benign: false
min_agents: 4
description: >
  Four agents own packages in a dependency chain (datasource -> pipeline ->
  report -> cli). Agent A renames a function in the chain's root with no
  backward-compatible alias; every downstream agent that read the old name
  before the rename is acting on an invalidated premise.
agents:
  - id: agent-datasource
    prompt: >
      In the datasource package (datasource/parser.py and datasource/filters.py
      as needed), rename parse_records to parse_dataset (no backward-compatible
      alias may remain in datasource/__init__.py or elsewhere), and make parsing
      more robust: skip blank lines and lines starting with "#". Keep the same
      return format. Only change files under datasource/.
  - id: agent-pipeline
    prompt: >
      In the pipeline package, implement the stubs in pipeline/aggregate.py
      (summarize) and pipeline/text.py (summarize_text) exactly per their
      docstrings. summarize_text must reuse the record-parsing function that
      the datasource package provides — read datasource/ to see it. Update
      pipeline/__init__.py if needed. Only change files under pipeline/.
  - id: agent-report
    prompt: >
      In the report package, implement the stubs in report/format.py
      (format_report) and report/from_text.py (report_from_text) exactly per
      their docstrings. report_from_text must reuse pipeline.summarize_text.
      Only change files under report/.
  - id: agent-cli
    prompt: >
      In the cli package, implement build_report in cli/main.py exactly per its
      docstring by reusing report.report_from_text. Only change files under cli/.
