name: t3_fetch_clobber
failure_mode: write_write_clobber
benign: false
description: >
  Hardened t3: both agents must replace the entire fetch() function (and may
  rewrite api.py via write_file) from the version they last read. Micro-edits
  that only add one kwarg are insufficient — the final fetch must integrate
  both timeout and retries. Stale whole-file rewrites under naive clobber.
agents:
  - id: agent-timeout
    prompt: >
      In api.py, replace the ENTIRE fetch function in one write. Prefer
      write_file of the whole api.py from the content you last read_file'd
      (do not use small edit_file patches that only touch the signature).
      fetch must take keyword timeout=10 and call transport(url, timeout=timeout)
      instead of transport(url). Preserve TransportError and any other behavior
      already present in the file you read (including peer changes on re-read).
      Your final write for api.py must be a full-file write_file.
  - id: agent-retries
    prompt: >
      In api.py, replace the ENTIRE fetch function in one write. Prefer
      write_file of the whole api.py from the content you last read_file'd
      (do not use small edit_file patches that only touch the signature).
      fetch must take keyword retries=3, call the transport, and if it raises
      TransportError retry up to `retries` additional times, re-raising the
      last TransportError if every attempt fails. Preserve TransportError and
      any other behavior already present in the file you read (including peer
      changes on re-read — if timeout already exists, keep it). Your final
      write for api.py must be a full-file write_file.
