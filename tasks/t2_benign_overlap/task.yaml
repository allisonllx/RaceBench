name: t2_benign_overlap
failure_mode: benign_overlap_false_positive
benign: true
description: >
  Two agents implement two DIFFERENT stub functions in the same file. The edits
  are provably disjoint at the symbol level; the correct coordination behavior
  is to do nothing. Any stall this task triggers is a false positive, which is
  the metric this task exists to measure.
agents:
  - id: agent-slugify
    prompt: >
      In stringutils.py, implement the stub function slugify(text) exactly per
      its docstring: lowercase the text, replace every run of characters that
      are not a-z or 0-9 with a single hyphen, and strip leading/trailing
      hyphens. The "re" module is already imported. Do not touch truncate() or
      anything else.
  - id: agent-truncate
    prompt: >
      In stringutils.py, implement the stub function truncate(text, max_len,
      suffix="...") exactly per its docstring: if len(text) <= max_len return
      text unchanged; otherwise return a string of exactly max_len characters
      ending with the suffix (i.e. keep the first max_len - len(suffix)
      characters, then append suffix). If max_len < len(suffix), return
      suffix[:max_len]. Do not touch slugify() or anything else.
