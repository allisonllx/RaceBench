name: t06_feature_pair
failure_mode: realistic_feature_pair
benign: false
description: >
  CooperBench-style: two features both rewrite Cache in cache/core.py. Supporting
  modules (expiry, eviction, policies) force navigation before editing.
agents:
  - id: agent-ttl
    prompt: >
      In the cache package, add time-to-live support to Cache in cache/core.py.
      set() gains an optional keyword parameter ttl=None (seconds). When ttl is
      set, the entry expires ttl seconds after insertion, measured with
      cache.clock_adapter.now() (also available via the top-level clock module).
      get() must treat an expired entry exactly like a missing key (return
      default) and delete it. Entries with ttl=None never expire. You may
      implement helpers in cache/expiry.py. Keep every other behavior working,
      including any behavior other agents may be adding concurrently. Prefer
      editing files under cache/; do not break the package exports.
  - id: agent-evict
    prompt: >
      In the cache package, add bounded-size eviction to Cache in cache/core.py.
      __init__ gains an optional keyword parameter on_evict=None. When set()
      inserts a NEW key while len(cache) == max_size, the oldest-inserted key
      must be evicted first, and on_evict(key, value) called with the evicted
      pair if the callback is set. Updating an existing key never evicts. You
      may implement helpers in cache/eviction.py. Keep every other behavior
      working, including any behavior other agents may be adding concurrently.
      Prefer editing files under cache/; do not break the package exports.
