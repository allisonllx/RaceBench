name: t01_stale_clobber
failure_mode: stale_read_lost_update
benign: false
description: >
  Hardened t1: both agents must rewrite the entire config.py via write_file
  from the version they last read. Piecemeal edit_file is forbidden by the
  subtask. Under naive, a second whole-file write from a stale read silently
  drops the peer's key; coordination must force a re-read or merge.
agents:
  - id: agent-timeout
    prompt: >
      Rewrite the ENTIRE file config.py using write_file (do not use
      edit_file). Start from the content you last read_file'd. Add a
      configuration key "timeout" with default 30.0 to DEFAULTS, and extend
      validate() so a "timeout" override must be an int or float strictly
      greater than 0, raising ValueError("timeout must be a positive number")
      otherwise. Preserve every other key and validation rule already present
      in the file you read (including any concurrent peer changes you see on
      re-read). Your final tool call for this file must be write_file with the
      full file contents.
  - id: agent-retries
    prompt: >
      Rewrite the ENTIRE file config.py using write_file (do not use
      edit_file). Start from the content you last read_file'd. Add a
      configuration key "retries" with default 3 to DEFAULTS, and extend
      validate() so a "retries" override must be an int greater than or equal
      to 0, raising ValueError("retries must be a non-negative int") otherwise.
      Preserve every other key and validation rule already present in the file
      you read (including any concurrent peer changes you see on re-read).
      Your final tool call for this file must be write_file with the full file
      contents.
