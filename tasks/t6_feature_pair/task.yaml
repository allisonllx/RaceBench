name: t6_feature_pair
failure_mode: realistic_feature_pair
benign: false
description: >
  CooperBench-style scenario (arXiv:2601.13295): two independently-specified
  features on one small library that both rewrite the same class (Cache.set
  and Cache.__init__). Individually easy, but the final class must contain
  BOTH features integrated. We authored this task in CooperBench's style
  rather than porting one of its tasks verbatim: its tasks assume much larger
  repos and per-task container images than a per-trial harness copy allows;
  the design (two conflicting feature specs, hidden expert tests) is the same.
agents:
  - id: agent-ttl
    prompt: >
      In cache.py, add time-to-live support to Cache. set() gains an optional
      keyword parameter ttl=None (seconds). When ttl is set, the entry expires
      ttl seconds after insertion, measured with clock.now(). get() must treat
      an expired entry exactly like a missing key (return default) and delete
      it from the cache. Entries with ttl=None never expire. Keep every other
      behavior working, including any behavior other agents may be adding
      concurrently. Only change cache.py.
  - id: agent-evict
    prompt: >
      In cache.py, add bounded-size eviction to Cache. __init__ gains an
      optional keyword parameter on_evict=None. When set() inserts a NEW key
      while len(cache) == max_size, the oldest-inserted key must be evicted
      first, and on_evict(key, value) called with the evicted pair if the
      callback is set. Updating an existing key never evicts. Keep every other
      behavior working, including any behavior other agents may be adding
      concurrently. Only change cache.py.
