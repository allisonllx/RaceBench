name: t1_stale_read
failure_mode: stale_read_lost_update
benign: false
description: >
  Two agents each add one config key to the same DEFAULTS dict and extend the
  same validate() function. Both must land for the oracle to pass; an
  uncoordinated whole-file write silently drops the other agent's key.
agents:
  - id: agent-timeout
    prompt: >
      In config.py, add a new configuration key "timeout" with default value
      30.0 to the DEFAULTS dict. Extend validate() so that a "timeout" override
      must be an int or float strictly greater than 0, raising ValueError
      ("timeout must be a positive number") otherwise. Do not change any other
      keys or validation rules.
  - id: agent-retries
    prompt: >
      In config.py, add a new configuration key "retries" with default value 3
      to the DEFAULTS dict. Extend validate() so that a "retries" override must
      be an int greater than or equal to 0, raising ValueError ("retries must
      be a non-negative int") otherwise. Do not change any other keys or
      validation rules.
