failure_mode: cross_file_dependency
collision_points:
  - file: models/user.py
    symbol: make_user -> create_user
    agents: [agent-models]
    kind: interface_change
  - file: services/registration.py
    symbol: register
    agents: [agent-services]
    kind: stale_premise_consumer
expected_anomaly: >
  No same-file write ever happens. Services may ship a call to make_user after
  models removed it. Multi-package layout increases the chance of a stale read
  of models/__init__.py.
