[project]
name = "racebench"
version = "0.1.0"
description = "A neutral, reproducible benchmark for multi-agent coding coordination strategies"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
megaagent = [
    "chromadb>=0.4",
    "requests>=2.31",
]
cursor = [
    "cursor-sdk>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness", "harness.strategies", "harness.external_runtimes", "adapters", "adapters.megaagent", "runner", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
